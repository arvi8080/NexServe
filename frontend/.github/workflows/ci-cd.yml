name: GlowHome Full-Stack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  typecheck-and-lint:
    name: 1. TypeScript Typecheck & Syntax Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  unit-and-integration-test:
    name: 2. Vitest Automated Testing Suite
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --passWithNoTests

  build-production-bundle:
    name: 3. Production Vite Bundle Verification
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  docker-image-build:
    name: 4. Docker Production Image Build
    runs-on: ubuntu-latest
    needs: [unit-and-integration-test, build-production-bundle]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t glowhome-app:${{ github.sha }} .
