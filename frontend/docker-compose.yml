version: '3.8'

services:
  glowhome-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=https://api.glowhome.com
    restart: always

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: glowhome_admin
      POSTGRES_PASSWORD: glowhome_secure_password_2026
      POSTGRES_DB: glowhome_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
